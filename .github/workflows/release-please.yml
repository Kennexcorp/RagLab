name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    steps:
      # Maintains a release PR that bumps the version in pyproject.toml and updates
      # CHANGELOG.md. Merging that PR tags vX.Y.Z and publishes a GitHub Release,
      # which in turn triggers the version-tagged GHCR push in publish.yml.
      #
      # This reads conventional commits (feat:, fix:, feat!:). Commits that do not
      # follow the convention are ignored and will not appear in the changelog.
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
